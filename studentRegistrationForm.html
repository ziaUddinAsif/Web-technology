<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <fieldset>
        <legend>
            Registration form
        </legend>
        <form action="#">
            <label for="name">Full </label>
            <input type="text" name="name" id="name" placeholder="Enter Your name">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" name="age" id="password" required>
            <br><br>
            <label for="age">Age:</label>
            <input type="age" name="age" id="age" required>
            <br><br>
            <label for="date">Date of Birth:</label>
            <input type="date" name="date" id="date" required>
            <br><br>
            Gender:
            <input type="radio" name="Gender" value="Male">Male
            <input type="radio" name="Gender" value="Female">Female
            <input type="radio" name="Gender" value="Someting else">Something else
            <br><br>
            <label for="city">City:</label>
            <input type="city" name="city" id="city" required>
            <br><br>

            Hobbies:
            <input type="checkbox">Reading
            <input type="checkbox">Cricket
            <input type="checkbox">Music
            <br><br>
            <label for="">About Yourself:</label>
            <textarea name="about" id="about"></textarea>
            <br><br>

            <input type="submit">

        </form>
    </fieldset>
</body>

</html>
